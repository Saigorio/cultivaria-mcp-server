services:
  - type: web
    name: cultivaria-mcp-server
    env: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 3001
      - key: CULTIVARIA_MCP_TOKEN
        value: cultivaria_mcp_secret_token_2026
      - key: BACKEND_URL
        value: https://cultivaria-9673f-default-rtdb.firebaseio.com
